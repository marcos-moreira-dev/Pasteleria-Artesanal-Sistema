services:
  postgres:
    image: postgres:17-alpine
    container_name: pasteleria-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: pasteleria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - pasteleria-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pasteleria-dev-postgres-data:

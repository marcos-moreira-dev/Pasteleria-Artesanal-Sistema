# Configuración para Docker Compose - Flyway administra el esquema
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/pasteleria
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:pasteleria-super-secret-key-2024-for-jwt-tokens}
    expiration-seconds: 7200
    issuer: pasteleria-backend
  storage:
    root: ${APP_STORAGE_ROOT:/app/storage}
    report-path: ${REPORT_STORAGE_PATH:/app/storage/reportes}

spring:
  application:
    name: pasteleria-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pasteleria}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:./storage/

server:
  port: ${APP_PORT:8080}
  tomcat:
    threads:
      max: 10
      min-spare: 2
    accept-count: 100
    max-connections: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
    issuer: ${JWT_ISSUER:pasteleria-backend}
  notification:
    default-limit: ${NOTIFICATION_DEFAULT_LIMIT:8}
    archive-read-after-days: ${NOTIFICATION_ARCHIVE_READ_AFTER_DAYS:10}
    archive-cron: ${NOTIFICATION_ARCHIVE_CRON:0 0 3 * * *}
  report:
    worker-enabled: ${REPORT_WORKER_ENABLED:true}
    worker-delay-ms: ${REPORT_WORKER_DELAY_MS:2500}
    worker-batch-size: ${REPORT_WORKER_BATCH_SIZE:3}
    retention-days: ${REPORT_RETENTION_DAYS:14}
    cleanup-cron: ${REPORT_CLEANUP_CRON:0 15 3 * * *}
  storage:
    report-path: ${REPORT_STORAGE_PATH:./storage/reportes}

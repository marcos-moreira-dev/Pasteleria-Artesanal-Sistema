spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:pasteleria}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration,classpath:db/dev-migration
  jpa:
    show-sql: true

logging:
  level:
    com.pasteleria: INFO
    org.springframework.security: INFO

app:
  jwt:
    secret: ${JWT_SECRET:ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ}
  storage:
    root: ${APP_STORAGE_ROOT:./storage}
    report-path: ${REPORT_STORAGE_PATH:${APP_STORAGE_ROOT:./storage}/reportes}

services:
  postgres:
    image: postgres:17-alpine
    container_name: pasteleria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pasteleria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pasteleria-postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pasteleria-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pasteleria
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pasteleria-postgres-data:
